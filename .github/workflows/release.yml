name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bin_path: bin/x64/Release/FeihuaLing.exe
          - os: ubuntu-latest
            name: linux
            bin_path: build/FeihuaLing
          - os: macos-latest
            name: macos
            bin_path: build/FeihuaLing

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ---- Windows: MSBuild (same as build.yml) ----
      - name: Add MSVC to PATH
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with MSBuild
        if: matrix.name == 'windows'
        run: msbuild FeihuaLing.sln /p:Configuration=Release /p:Platform=x64 /m

      # ---- Linux: CMake + gcc ----
      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure CMake (Linux)
        if: matrix.name == 'linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # ---- macOS: CMake + clang universal ----
      - name: Install dependencies (macOS)
        if: matrix.name == 'macos'
        run: brew install cmake

      - name: Configure CMake (macOS)
        if: matrix.name == 'macos'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      # ---- Build (Linux/macOS) ----
      - name: Build
        if: matrix.name != 'windows'
        run: cmake --build build -j

      # ---- Package ----
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          cp "${{ matrix.bin_path }}" pkg/
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp download_data.bat pkg/
          else
            cp download_data.sh pkg/
          fi
          cp README.md pkg/
          cd pkg
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../FeihuaLing-${{ matrix.name }}.zip *
          else
            zip -r ../FeihuaLing-${{ matrix.name }}.zip *
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: FeihuaLing-${{ matrix.name }}.zip
          generate_release_notes: true
